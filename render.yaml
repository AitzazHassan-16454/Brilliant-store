services:
  - type: web
    name: brilliant-store
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: APP_NAME
        value: GharBazaar
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: FILESYSTEM_DISK
        value: public
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
